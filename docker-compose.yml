version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ./api/.env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # ⚠️ Nuxt 3 runtime override naming rule:
      #   runtimeConfig.apiBase            → NUXT_API_BASE
      #   runtimeConfig.public.apiBase     → NUXT_PUBLIC_API_BASE
      #   runtimeConfig.public.clawcoinRpc → NUXT_PUBLIC_CLAWCOIN_RPC
      # If the env name doesn't match the config key, Nuxt silently ignores it
      # and falls back to the value baked in at `nuxt build` time.
      NUXT_API_BASE: http://api:8080/api/v1        # SSR (container-internal)
      NUXT_PUBLIC_API_BASE: /api/v1                # browser (via nginx proxy, relative URL)
      NUXT_PUBLIC_CLAWCOIN_RPC: https://evm-testnet.clawcoin.com
      NUXT_PUBLIC_CLAWCOIN_CHAIN_ID: "11111110"
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - api
      - frontend

